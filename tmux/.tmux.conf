# tmux v2.0 installation steps for Ubuntu 14.04 (Trusty Tahr)
# tmux -V
# sudo apt-get update
# sudo apt-get install -y python-software-properties software-properties-common
# sudo add-apt-repository -y ppa:pi-rho/dev
# sudo apt-get update
# sudo apt-get install -y tmux
# tmux -V

if-shell "uname | grep -q Darwin" "set-option -g default-shell /usr/local/bin/fish" "set-option -g default-shell /usr/bin/fish"

# use UTF8
# set -g utf8
# set-window-option -g utf8 on

# make tmux display things in 256 colors
set -g default-terminal "tmux-256color"
set -ag terminal-features ",*:RGB"

# Pass outer-terminal features through to apps (kitty supports all of these):
# curly/colored underlines (nvim diagnostics) and OSC 8 clickable hyperlinks
set -as terminal-features ",*:usstyle"
set -as terminal-features ",*:hyperlinks"
# Let apps in the visible pane talk to the terminal directly
# (needed for kitty graphics: `kitten icat`, yazi/image.nvim previews)
set -g allow-passthrough on
# terminal-features apply when a client attaches: detach/reattach after changing them

# set scrollback history to 10000 (10k)
set -g history-limit 10000

# set Ctrl-a as the default prefix key combination
# and Ctrl-s as a secondary prefix, then unbind C-b to free it up
set -g prefix C-a
set -g prefix2 C-s
unbind C-b

# use send-prefix to pass prefix keys through to applications
bind C-a send-prefix
bind C-s send-prefix

# ============================================================
# Nested / remote tmux passthrough
# When SSH'd into another host running this same config, both tmux
# servers share the C-a/C-s prefix and all Alt/Shift no-prefix bindings.
# Press F12 to flip THIS (outer/local) tmux into an "off" key-table:
# every keystroke is forwarded to the inner (remote) tmux. The status
# bar flips color while off. Press F12 again to take control back.
# Nests to any depth: press F12 once per level to step inward.
# ============================================================
bind -T root F12 \
    set prefix None \;\
    set prefix2 None \;\
    set key-table off \;\
    set status-style "fg=black,bg=colour245" \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S

bind -T off F12 \
    set -u prefix \;\
    set -u prefix2 \;\
    set -u key-table \;\
    set -u status-style \;\
    refresh-client -S

# enable vi mode
set-window-option -g mode-keys vi

# shorten command delay
set -sg escape-time 1

# Enable extended keys (CSI u / kitty keyboard protocol)
set -g extended-keys on

# set window and pane index to 1 (0 by default)
set-option -g base-index 1
setw -g pane-base-index 1

# reload ~/.tmux.conf using PREFIX r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Set easier window split keys
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift+Arrow L/R to switch windows (tabs)
bind -n S-Left previous-window
bind -n S-Right next-window

# Alt+number to switch to window (tabs)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# k to scroll up in copy mode
bind k copy-mode \; send-keys -X page-up

# Prefix j — fuzzy-pick a pane from another session and join it to the current window
bind j run-shell '~/.config/tmux/scripts/join_pane_from_session.sh'

# Alt+a — grid of live previews of every pane running Claude Code / Codex, with a
# status badge per pane (needs you / working / idle). Enter jumps to the pane.
# Launched via run-shell because display-popup doesn't expand #{...} in its command.
bind -n M-a run-shell -b 'tmux display-popup -c "#{client_name}" -E -w 100% -h 100% -B "~/.config/tmux/scripts/agent_grid.py #{client_name}"'

# Enable automatic window renaming (basename of current pane's directory)
setw -g automatic-rename on
setw -g automatic-rename-format '#{=4:#{b:pane_current_path}}'

# Alt+z to zoom/unzoom current pane (no prefix)
bind -n M-z resize-pane -Z

# Every copy-pipe action (mouse drag release, double/triple click, Enter in copy
# mode) also pipes the selection to the Wayland clipboard. A root-table
# MouseDragEnd1Pane binding never fires: dragging enters copy mode first, so the
# release is handled by the copy-mode-vi table.
set -g copy-command 'wl-copy'

# Alt+s to enter copy mode and search backward (no prefix)
bind -n M-s copy-mode \; command-prompt -T search -p "(search up)" "send-keys -X search-backward '%%'"

# Make the current window the first window
bind T swap-window -t 1

# Mouse Mode
set-option -g mouse on
set -g history-limit 10000

# ----------------------
# set some pretty colors
# ----------------------
# set pane colors - hilight the active pane
#set-option -g pane-border-fg colour240
#set-option -g pane-active-border-fg cyan

# colorize messages in the command line
#set-option -g message-bg black #base02
#set-option -g message-fg brightred #orange

# ----------------------
# Status Bar
# -----------------------
set-option -g status on                # turn the status bar on
# set -g status-utf8 on                  # set utf-8 for the status bar
set -g status-interval 5               # set update frequencey (default 15 seconds)
set -g status-justify left             # left align window list for more space
# set-option -g status-position top    # position the status bar at top of screen

# no activity tracking: tabs show a zoom marker instead (see below)
setw -g monitor-activity off
set -g visual-activity off


# Flat padded tabs: current window green, others grey.
# A window with a zoomed pane gets a zoom marker inside its tab: a magnifier icon
# (nf-md-magnify_plus) when the client is kitty, whose font is a Nerd Font, else "Z".
# client_termtype comes from the terminal's XTVERSION reply, so it survives SSH; a
# tmux nested in another tmux (F12) sees the outer tmux instead and falls back to "Z".
# Activity/bell get no styling at all.
set -g window-status-separator ' '
setw -g window-status-activity-style none
setw -g window-status-bell-style none
# Colours that differ between light and dark come from @tab_* (set by scripts/theme.sh).
set -g @zoom_mark "#{?#{m:kitty*,#{client_termtype}},\U000F0349,Z}"
setw -g window-status-format \
    '#[fg=#{@tab_fg},bg=#{@tab_bg}] #I #W#{?window_zoomed_flag,#[fg=#{@tab_zoom_fg}] #{E:@zoom_mark},} #[default]'
setw -g window-status-current-format \
    '#[fg=colour235,bg=colour114,bold] #I #W#{?window_zoomed_flag,#[fg=colour52] #{E:@zoom_mark},} #[default]'

# Light/dark theme: tmux 3.6 asks the outer terminal for its theme (kitty follows
# the desktop setting, see kitty.conf) and runs these hooks when a client switches.
# The toggle at the end of the status bar can force light or dark instead, e.g. for
# Termius, which reports no theme. Details in scripts/theme.sh.
set-hook -g client-dark-theme 'run-shell -b "~/.config/tmux/scripts/theme.sh dark"'
set-hook -g client-light-theme 'run-shell -b "~/.config/tmux/scripts/theme.sh light"'
run-shell '~/.config/tmux/scripts/theme.sh'

# hide session name and username to save space
set -g status-left ''
# Ends with the theme toggle: ◐ auto, ☀ light, ☾ dark; click cycles (padded for taps)
set -g status-right "#(~/.config/tmux/scripts/ram_status.sh) LA #(/usr/bin/awk '{print $1}' /proc/loadavg) #[range=user|theme] #{@theme_icon} #[norange]"
bind -n MouseDown1Status {
    if -F '#{==:#{mouse_status_range},theme}' {
        run-shell -b '~/.config/tmux/scripts/theme.sh cycle'
    } {
        switch-client -t =
    }
}
set -g status-left-length 70

# Fuzzy dir history picker (mirrors fish Ctrl+g, works in any app)
# Tab after selecting a dir opens a second picker to also select a file
bind -n M-c run-shell '~/.config/tmux/scripts/fuzzy_insert_path.sh "#{pane_id}"'
# New window opens the same picker in "cd" mode: the chosen dir is cd'ed into
# (Esc just leaves the new shell in the current pane's dir)
bind c new-window -c "#{pane_current_path}" \; run-shell '~/.config/tmux/scripts/fuzzy_insert_path.sh "#{pane_id}" cd'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-copycat'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
