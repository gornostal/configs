# vim:ft=kitty
# The "dark" theme of elementary OS Terminal (io.elementary.terminal), copied from
# its src/Themes.vala: a Solarized palette on a neutral grey background.

foreground #a5a5a5
background #2E2E2E

cursor            #839496
cursor_text_color background

# Like Terminal (VTE with no highlight color set): selection is reverse video
selection_foreground none
selection_background none

url_color #268bd2

# black
color0  #073642
color8  #5e5c64

# red
color1  #dc322f
color9  #dc322f

# green
color2  #859900
color10 #586e75

# yellow
color3  #b58900
color11 #657b83

# blue
color4  #268bd2
color12 #839496

# magenta
color5  #d33682
color13 #6c71c4

# cyan
color6  #2aa198
color14 #93a1a1

# white
color7  #eee8d5
color15 #fdf6e3
