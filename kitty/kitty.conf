# vim:ft=kitty

# Reload saved config edits (including files reached through the config symlink).
auto_reload_config 0.1

# --- Fonts -------------------------------------------------------------------
font_family      RobotoMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0
# Slightly taller lines read more comfortably
modify_font      cell_height 110%
disable_ligatures cursor

# --- Window ------------------------------------------------------------------
# No titlebar or kitty shadow: the shader below draws rounded corners and its own
# shadow (titlebar-only leaves white corners on Gala). Changing this needs a restart.
hide_window_decorations yes
# Rounded corners + drop shadow (kitty/shaders/); needs background_opacity < 1
custom_shaders          rounded-corners
# Keeps text clear of the transparent shadow band the shader draws around the window
single_window_margin_width 15
# Also how much of the blurred desktop shows through (gala-blur.c, preloaded by kitty-toggle)
background_opacity      0.85
dynamic_background_opacity yes
# Cells painted with these exact colors stay translucent too: the theme backgrounds,
# which tmux paints when its theme toggle forces light or dark (tmux/scripts/theme.sh)
transparent_background_colors #2e2e2e #fdf6e3
window_padding_width    10 14
remember_window_size    yes
confirm_os_window_close -1
enable_audio_bell       no
# On Wayland the bell "attention" request is an xdg-activation activate, and Gala
# honours it by raising/focusing the window — so any BEL (tmux passes them through
# from every window) would pop kitty up. tmux's status-bar bell dot is enough.
window_alert_on_bell    no

# --- Cursor ------------------------------------------------------------------
cursor_shape               beam
cursor_beam_thickness      1.8
cursor_blink_interval      0.6
cursor_stop_blinking_after 10
# Smooth animated trail when the cursor jumps
cursor_trail               3
cursor_trail_decay         0.1 0.4

# --- Scrollback & mouse ------------------------------------------------------
scrollback_lines          20000
scrollback_pager_history_size 64
wheel_scroll_multiplier   3.0
copy_on_select            yes
strip_trailing_spaces     smart
mouse_hide_wait           2.0
url_style                 curly
show_hyperlink_targets    yes

# --- Layout: tmux handles splits/tabs, kitty stays a single pane ------------
enabled_layouts           stack
tab_bar_style             hidden
# Free up keys kitty would otherwise grab from tmux
map ctrl+shift+enter
map ctrl+shift+t
map ctrl+shift+n
map ctrl+shift+left
map ctrl+shift+right

# --- Remote control: lets ~/bin/kitty-toggle (Super+X) focus this window --------
# (the socket itself is passed by that script, so other kitty instances don't clash)
allow_remote_control      socket-only

# --- Wayland / IME -----------------------------------------------------------
# Disable IME to fix keyboard navigation in kittens (themes, choose-fonts, etc.)
wayland_enable_ime no

# --- Keys --------------------------------------------------------------------
# Font size
map ctrl+equal      change_font_size all +1.0
map ctrl+minus      change_font_size all -1.0
map ctrl+0          change_font_size all 0

# Opacity: ctrl+shift+a then m (more) / l (less) / 1 (opaque)
map ctrl+shift+a>m  set_background_opacity +0.05
map ctrl+shift+a>l  set_background_opacity -0.05
map ctrl+shift+a>1  set_background_opacity 1

# --- Colors ------------------------------------------------------------------
# Follows the desktop light/dark setting (elementary: System Settings → Desktop →
# Appearance, read through the XDG portal): kitty applies dark-theme.auto.conf,
# light-theme.auto.conf or no-preference-theme.auto.conf on top of this file and
# swaps them live. It also reports each switch to apps that ask (DEC mode 2031),
# which is how tmux 3.6 and Claude Code follow along. This include is only the
# fallback. Edit the elementary-*.conf palettes; `kitten themes` would overwrite
# the auto files.
include elementary-dark.conf

# Faint (SGR 2) text is the foreground blended this far into the background. The
# default 0.4 is barely readable on the light theme, more so through the translucent
# background. A global option: the *-theme.auto.conf files only apply colors.
dim_opacity 0.75
